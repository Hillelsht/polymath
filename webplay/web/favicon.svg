<!--
  The mark: four tiles in the four difficulty colours of a Chains grid, easiest to hardest,
  reading left to right and top to bottom. The same four colours the share grid is drawn in, so a
  result pasted into a chat and the tab it came from are recognisably one thing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Polymath">
  <rect width="32" height="32" rx="7" fill="#14151A"/>
  <rect x="5.5"  y="5.5"  width="9.5" height="9.5" rx="2.5" fill="#D9A441"/>
  <rect x="17"   y="5.5"  width="9.5" height="9.5" rx="2.5" fill="#6FAE6A"/>
  <rect x="5.5"  y="17"   width="9.5" height="9.5" rx="2.5" fill="#5B8ED6"/>
  <rect x="17"   y="17"   width="9.5" height="9.5" rx="2.5" fill="#9B72C7"/>
</svg>
