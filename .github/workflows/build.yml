name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests:
    name: Learning engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The domain layer has no Android dependencies, so this runs on its own and
      # fails fast if the scheduler, quiz generator or the 517-fact curriculum break.
      - name: Run engine and curriculum tests
        run: ./gradlew -p enginetests test

      # The contract a pack has to meet. It catches what the parser cannot: an answerType too thin
      # to draw distractors from, a question containing its own answer, a translated fact id that
      # would install over the English fact and take its review history with it.
      #
      # Two runs, at two bars, because they are two different questions. Everything published is
      # held to the errors — the things that would actually misbehave on a phone. A pack arriving
      # from outside is held to the warnings as well, because it is the moment when fixing a thin
      # answerType costs one edit rather than a migration. The authoring sources under
      # `assets/content/` are not validated separately: they are the same facts as their enriched
      # copies in `packs/`, and one run must see one corpus or every id looks duplicated.
      #
      # See docs/community-packs.md.
      - name: Every pack still meets the contract
        run: |
          python3 tools/validate_pack.py --self-test
          python3 tools/validate_pack.py packs
          if [ -d packs/community ]; then
            python3 tools/validate_pack.py --strict packs/community
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: enginetests/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK
        # The compiler errors are repeated at the end on failure, because --stacktrace buries
        # them under 130 lines of Gradle internals and this app is developed somewhere that
        # cannot compile Android at all — CI is the only compiler, and its log is the only way
        # to read what it said. Putting the `e:` lines last makes a red build legible from the
        # tail instead of by paging back through the whole run.
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/assemble.log || {
            echo ""
            echo "================ Kotlin compiler errors ================"
            grep -E "^e: " /tmp/assemble.log | head -60 || echo "(no e: lines — see the log above)"
            echo "========================================================"
            exit 1
          }

      - name: Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A rolling public release so the APK installs from one stable link on a phone,
      # with no GitHub login and no artifact-zip dance.
      - name: Publish rolling release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk smart.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Smart (latest build)
          body: |
            Rolling build of the latest `main`. Download `smart.apk` on your phone and tap to install
            (allow installs from your browser or file manager if asked). Android 8.0+.
          files: smart.apk
          prerelease: false
