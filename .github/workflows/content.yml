name: Content pipeline

on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/content/**"
      - "tools/enrich_content.py"
      - "tools/enrich_videos.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    name: Enrich packs from Wikipedia
    runs-on: ubuntu-latest
    # The pipeline's own commit must not retrigger the pipeline.
    if: "!contains(github.event.head_commit.message, '[content-pipeline]')"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve images and extracts
        run: python3 tools/enrich_content.py

      - name: Verify the video catalog
        run: python3 tools/enrich_videos.py

      - name: Commit enriched packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs app/src/main/assets/packs
          if git diff --cached --quiet; then
            echo "Packs unchanged"
          else
            git commit -m "[content-pipeline] Refresh enriched packs"
            git push
          fi
