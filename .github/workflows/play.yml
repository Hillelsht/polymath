name: Play

# Keeps the daily Chains grids topped up.
#
# Grids are built here rather than on the phone because the whole appeal of a daily puzzle is
# that it is the same one everybody else got, and devices hold different subsets of the library
# once the top-up has been running. A phone shuffling its own grid would be playing a different
# puzzle to the person it is being compared with.
#
# Monthly, a few months ahead, so a run that fails is noticed long before anyone opens the app
# to find nothing waiting.
on:
  schedule:
    - cron: "23 5 2 * *"
  push:
    paths:
      - "tools/build_chains.py"
      - "packs/play/climb.json"
  workflow_dispatch:
    inputs:
      months:
        description: "How many months to publish, starting with this one"
        default: "4"

permissions:
  contents: write

jobs:
  chains:
    name: Publish the daily grids
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[play]')"
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Self-test the generator
        # No network needed at all — it reads the published library off disk — so a logic bug
        # fails in a second rather than after the grids are already written.
        run: python3 tools/build_chains.py --self-test

      - name: Build the grids
        run: python3 tools/build_chains.py --months "${{ github.event.inputs.months || 4 }}"

      - name: Check the app would accept every grid
        # PlayContentTest applies the device's own rules to what was just written: that no tile
        # is in two groups, that each grid can be solved by submitting its own answer, and that
        # every relic names an effect this build can grant. A grid that fails these is a day
        # with no puzzle for everyone who has the app, which is why it is checked before the
        # commit rather than after.
        run: ./gradlew -p enginetests test

      - name: Commit the grids
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/play
          if git diff --cached --quiet; then
            echo "Grids unchanged"
          else
            git commit -m "[play] Publish daily Chains grids"
            git push
          fi
