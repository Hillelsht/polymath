# This was `vaults.yml` while the site was a single game. It now builds and publishes the whole
# Polymath portal — the daily and The Vaults — so it is named for what it does.
name: Web

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/hillelsht/smart/domain/play/vaults/**'
      - 'app/src/main/java/com/hillelsht/smart/domain/play/chains/**'
      - 'webplay/**'
      - 'tools/playtest/**'
      - 'packs/play/chains/**'
      - 'packs/play/vaults/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/hillelsht/smart/domain/play/vaults/**'
      - 'app/src/main/java/com/hillelsht/smart/domain/play/chains/**'
      - 'webplay/**'
      - 'tools/playtest/**'
      - 'packs/play/chains/**'
      - 'packs/play/vaults/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace a running one rather than fight it, but never cancel a deploy
# half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  play:
    name: Play it in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The rules, headless — the whole suite rather than a filter, because the checks this site
      # depends on live in three different packages: the margin gate that fails any room only
      # crossable with frame-perfect timing (the check Aryeh's Palace never had, see
      # docs/games.md), the Chains rules, and the content gate that refuses any published grid
      # where one tile fits two groups.
      - name: Game rules and published grids
        run: ./gradlew -p enginetests test

      - name: Compile the games to JavaScript
        run: ./gradlew -p webplay site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Actually presses the buttons. Palace passed every headless test it had and was still
      # unplayable, because nothing ever drove it through a real input path; the daily has the
      # same exposure one layer up, where a board that forgets itself on reload is invisible to
      # every unit test in the repo.
      - name: Play every room, both dailies, and a ghost race, in Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/playtest/play.js
          node tools/playtest/daily.js
          node tools/playtest/ghost.js

      - name: The standalone one-file build still assembles
        run: |
          python3 tools/playtest/inline.py --self-test
          python3 tools/playtest/inline.py --page vaults.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-screenshots
          path: webplay/build/web/*.png
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webplay/build/site

  deploy:
    name: Publish to Pages
    # Only from main: a pull request should be able to prove the games still play without
    # replacing what is currently published.
    if: github.ref == 'refs/heads/main'
    needs: play
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
