name: Probe

# Scaffolding, not a permanent workflow. The sandbox this app is developed in cannot reach
# YouTube at all, so questions like "does the RSS feed carry a duration" can only be answered
# from a runner. This exists to answer one, and is deleted once it has.
on:
  push:
    paths:
      - "tools/probe_*.py"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

jobs:
  durations:
    name: Where can a duration come from
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe keyless duration sources
        run: python3 tools/probe_durations.py
        # A "no keyless source" verdict is a finding, not a broken job.
        continue-on-error: true
