name: Library

# Generates the unbounded fact library from Wikidata, in every language the app ships.
#
# This is the only place the generator can run. The sandbox the app is developed in has no
# route to query.wikidata.org, so every Q-number and P-number in tools/generate_facts.py is
# unverified until this workflow prints the preflight table. Read that table before trusting
# a run: an id that resolves to the wrong thing is a template quietly harvesting nonsense.
#
# Monthly, not hourly. Wikidata's most-linked items barely move, and each full run writes
# several megabytes of shards.
#
# One language at a time, deliberately. Each job commits to `main`, and three of them racing
# would spend the run rebasing each other; the languages are also independent, so `fail-fast`
# is off — a Russian timeout must not cancel a Hebrew harvest that was going to succeed.
on:
  schedule:
    - cron: "41 4 3 * *"
  push:
    paths:
      - "tools/generate_facts.py"
  workflow_dispatch:
    inputs:
      languages:
        description: "Which languages to publish, comma separated"
        default: "en,ru,he"
      limit:
        description: "Facts per template (small = fast smoke run)"
        default: "400"
      budget_minutes:
        description: "Stop starting new templates after this long"
        default: "40"
      dry_run:
        description: "Harvest and report, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    name: Which languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - id: pick
        # A matrix cannot be built from a comma-separated string directly, so it is turned into
        # JSON here. Unknown tags are left in rather than filtered: the generator's own
        # `choices` rejects them by name, which is a clearer failure than a language silently
        # not running.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          raw = os.environ.get("LANGUAGES") or "en,ru,he"
          print("languages=" + json.dumps([t.strip() for t in raw.split(",") if t.strip()]))
          PY
        env:
          LANGUAGES: ${{ github.event.inputs.languages }}

  generate:
    name: Generate ${{ matrix.language }} facts from Wikidata
    needs: plan
    runs-on: ubuntu-latest
    # The pipeline's own commit must not retrigger the pipeline.
    if: "!contains(github.event.head_commit.message, '[library]')"
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
    # The generator bounds itself to --budget-minutes of harvesting plus one last template and
    # the Wikipedia extracts. This is the outer backstop, with room for those two tails.
    timeout-minutes: 75
    env:
      # Without this the run is invisible. Python block-buffers stdout when it is not a TTY,
      # so a 40-minute harvest prints nothing at all until it exits — and a cancelled or
      # timed-out job loses the buffer entirely, taking the per-template yields with it. The
      # CI log is the only window into a run that cannot happen anywhere else.
      PYTHONUNBUFFERED: "1"
      PUBLISHING: ${{ github.event_name != 'push' && github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the generator
        # Everything that needs no network. Runs first so a logic bug fails in seconds rather
        # than after forty minutes of harvesting. It also asserts every template is asked in
        # every language, so a template added in English alone is caught here rather than by
        # someone noticing a Russian library that holds four categories instead of six.
        run: python3 tools/generate_facts.py --self-test

      - name: Generate
        # A push to the generator validates it; it never publishes. Editing a template should
        # not silently replace the whole library as a side effect of saving the file — that is
        # what the schedule and a deliberate dispatch are for.
        run: |
          python3 tools/generate_facts.py \
            --language "${{ matrix.language }}" \
            --limit "${{ github.event.inputs.limit || 400 }}" \
            --budget-minutes "${{ github.event.inputs.budget_minutes || 40 }}" \
            ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'true') && '--dry-run' || '' }}

      - uses: actions/setup-java@v4
        if: env.PUBLISHING == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: env.PUBLISHING == 'true'

      - name: Check the app can read what was generated
        if: env.PUBLISHING == 'true'
        # GeneratedLibraryTest runs the app's real parser over the English shards just written,
        # and TranslatedLibraryTest over any other language's — including the check that every
        # translated fact id carries its language suffix, because a fact id reused from English
        # installs *over* the English fact and takes its review history with it. Without this the
        # regeneration commits straight to main and any such damage lands first, having already
        # replaced a library that worked.
        run: ./gradlew -p enginetests test

      # The content that failed is never committed, so without this the only record of *why* is a
      # line in a log that scrolls past the harvest. Uploaded on failure only, because a green run
      # has nothing to explain.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enginetests-${{ matrix.language }}
          path: enginetests/build/reports/tests/test
          if-no-files-found: ignore

      - name: Commit the library
        if: env.PUBLISHING == 'true'
        # English publishes at the path this pipeline has always used; every other language sits
        # under its own tag, which is the convention PackService resolves on the device.
        run: |
          set -euo pipefail
          lang="${{ matrix.language }}"
          dir=$([ "$lang" = "en" ] && echo "packs/library" || echo "packs/$lang/library")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir"
          if git diff --cached --quiet; then
            echo "Library unchanged for $lang"
            exit 0
          fi
          git commit -m "[library] Regenerate the $lang fact library from Wikidata"
          # Another language's job, or a human, may have landed a commit while this one was
          # harvesting for forty minutes. Rebasing and retrying is cheaper than throwing the
          # harvest away, which is what a plain non-fast-forward failure would do.
          #
          # Rebase onto **this run's own ref**, not onto main. An earlier version said `origin main`
          # and worked only by accident: on a dispatch against a branch it pulled main's history
          # into the branch and left the branch's real tip still unmerged, so every retry failed the
          # same way. Hebrew lost a ten-minute harvest to it after Russian pushed first.
          branch="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then exit 0; fi
            echo "push rejected, rebasing onto $branch (attempt $attempt)"
            git pull --rebase origin "$branch"
          done
          git push origin "HEAD:$branch"
